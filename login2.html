<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login CRM Vitória Design</title>

<style>

body{
    background:#121212;
    color:white;
    font-family:'Poppins',sans-serif;
    margin-left:260px;
    padding:20px;
}

.card{
    background:white;
    padding:40px;
    border-radius:15px;
    box-shadow:0 2px 15px rgba(0,0,0,.1);
    width:350px;
    text-align:center;
}

h1{
    color:#ff4fa3;
    text-align:center;
}

input{
    width:100%;
    padding:12px;
    background:#222;
    border:1px solid #333;
    border-radius:10px;
    color:white;
}
    input:focus{
    outline:none;
    border-color:#ff4fa3;
}

button{
    width:100%;
    background:#ff4fa3;
    color:white;
    border:none;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}
    .sidebar{
    position:fixed;
    left:0;
    top:0;
    width:240px;
    height:100%;
    background:#0d0d0d;
    border-right:1px solid #2a2a2a;
    padding:20px;
}
    .sidebar h2{
    color:#ff4fa3;
    margin-bottom:30px;
}
    .sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:12px;
    margin
        .sidebar a:hover{
    background:#ff4fa3;
}
        

</style>

</head>

<body>

<div class="card">

<h1>CRM Vitória Design</h1>

<p>Olá, Vitória 👋</p>

<input
type="password"
id="senha"
placeholder="Digite sua senha">

<button onclick="entrar()">
Entrar
</button>

</div>

<script>

function entrar(){

    const senha =
    document.getElementById("senha").value;

    if(senha === "201815"){

    sessionStorage.setItem(
        "crmLiberado",
        "sim"
    );

    window.location.href = "./crm.html";

}else{

        alert("Senha incorreta");

    }

}

</script>

    </body>
</html>
