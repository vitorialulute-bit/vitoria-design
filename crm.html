<title>CRM Vitória Design</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI', sans-serif;
    background:#faf7f8;
    display:flex;
}

.menu{
    width:260px;
    min-height:100vh;
    background:#f8d7e3;
    padding:25px;
}

.logo{
    font-size:24px;
    font-weight:bold;
    color:#b56576;
    margin-bottom:30px;
}

.menu a{
    display:block;
    background:white;
    text-decoration:none;
    color:#333;
    padding:12px;
    border-radius:12px;
    margin-bottom:10px;
}

.menu a:hover{
    background:#fff0f5;
}

.conteudo{
    flex:1;
    padding:30px;
}

.boas-vindas{
    margin-bottom:25px;
}

.boas-vindas h1{
    color:#b56576;
    margin-bottom:8px;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:15px;
    margin-bottom:25px;
}

.card-dashboard{
    background:white;
    border-radius:16px;
    padding:20px;
    text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.card-dashboard h2{
    color:#b56576;
    margin-top:10px;
}

.card{
    background:white;
    border-radius:16px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.btn{
    background:#e89bb5;
    color:white;
    border:none;
    border-radius:12px;
    padding:12px 18px;
    cursor:pointer;
}

.funil{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:15px;
}

.etapa{
    background:#fff;
    min-height:300px;
    border-radius:16px;
    padding:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.etapa h3{
    font-size:15px;
    margin-bottom:15px;
    color:#b56576;
}

</style>

</head>
