<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Vitória Design</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    margin:20px;
}

h1{
    color:#7c3aed;
}

.card{
    background:white;
    padding:20px;
    margin-bottom:15px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.lead{
    border-bottom:1px solid #ddd;
    padding:10px 0;
}

</style>

</head>

<body>

<h1>CRM Vitória Design</h1>

<div class="card">
    <h2>Leads Recebidos</h2>
    <div id="listaLeads">
        Carregando...
    </div>
</div>

<script type="module">

import { app } from "./firebase.js";

import {
    getFirestore,
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

const db = getFirestore(app);

const lista = document.getElementById("listaLeads");

async function carregarLeads(){

    try{

        const snapshot = await getDocs(collection(db,"leads"));

        lista.innerHTML = "";

        if(snapshot.empty){

            lista.innerHTML = "<p>Nenhum lead encontrado.</p>";
            return;

        }

        snapshot.forEach((doc)=>{

            const lead = doc.data();

            lista.innerHTML += `

            <div class="lead">

                <strong>${lead.nome || "Sem nome"}</strong><br>

                📞 ${lead.telefone || ""}<br>

                📧 ${lead.email || ""}<br>

                💼 ${lead.servico || ""}<br>

                📝 ${lead.observacao || ""}

            </div>

            `;

        });

    }catch(erro){

        console.error(erro);

        lista.innerHTML =
        "<p>Erro ao carregar leads.</p>";

    }

}

carregarLeads();

</script>

</body>

</html>
