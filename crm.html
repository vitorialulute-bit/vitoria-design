<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Vitória Design</title>

<style>

body{
    background:#121212;
    color:#ffffff;
    font-family:'Poppins',sans-serif;
}
    
h1{
    color:#ff4fa3;
    margin-bottom:20px;
}
    h2{
    color:#ff4fa3;
}
span{
    color:#ff4fa3;
    font-weight:bold;
}

.card{
    background:#1a1a1a;
    padding:20px;
    margin:20px 0;
    border-radius:15px;
    border:1px solid #2a2a2a;
    box-shadow:0 4px 15px rgba(0,0,0,.3);
}

.lead{
    border-bottom:1px solid #ddd;
    padding:10px 0;
}
    button{
    background:#ff4fa3;
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
    transition:0.3s;
}
    button:hover{
    background:#ff2f92;
}
    input,
select,
textarea{
    background:#1a1a1a;
    color:white;
    border:1px solid #333;
    border-radius:10px;
    padding:10px;
}
    input:focus,
select:focus,
textarea:focus{
    outline:none;
    border-color:#ff4fa3;
}
    body{
    max-width:1200px;
    margin:auto;
    padding:20px;
    background:#121212;
    color:white;
    font-family:'Poppins',sans-serif;
}

</style>

</head>

<body>

<h1>CRM Vitória Design</h1>
    <button onclick="sair()">Sair</button>
    <div class="card">

    <h2>📊 Resumo</h2>

    <p>🟦 Novos: <span id="totalNovos">0</span></p>

    <p>🟨 Atendimento: <span id="totalAtendimento">0</span></p>

    <p>🟩 Clientes: <span id="totalClientes">0</span></p>

    <p>🟥 Perdidos: <span id="totalPerdidos">0</span></p>

</div>

<div class="card">
    <h2>🟦 Novos Leads</h2>
    <div id="novos"></div>
</div>

<div class="card">
    <h2>🟨 Em Atendimento</h2>
    <div id="atendimento"></div>
</div>

<div class="card">
    <h2>🟩 Clientes</h2>
    <div id="clientes"></div>
</div>

<div class="card">
    <h2>🟥 Perdidos</h2>
    <div id="perdidos"></div>
</div>
</div>

<script type="module">

import { app } from "./firebase.js";

import {
    getFirestore,
    collection,
    getDocs,
    doc,
    updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

const db = getFirestore(app);
    
if(!sessionStorage.getItem("crmLiberado")){

    window.location.href = "./login2.html";

}


const novos = document.getElementById("novos");
const atendimento = document.getElementById("atendimento");
const clientes = document.getElementById("clientes");
const perdidos = document.getElementById("perdidos");
    const totalNovos = document.getElementById("totalNovos");
const totalAtendimento = document.getElementById("totalAtendimento");
const totalClientes = document.getElementById("totalClientes");
const totalPerdidos = document.getElementById("totalPerdidos");

async function carregarLeads(){

    try{

        const snapshot = await getDocs(collection(db,"leads"));

novos.innerHTML = "";
atendimento.innerHTML = "";
clientes.innerHTML = "";
perdidos.innerHTML = "";
        let contadorNovos = 0;
let contadorAtendimento = 0;
let contadorClientes = 0;
let contadorPerdidos = 0;

if(snapshot.empty){

    novos.innerHTML = "<p>Nenhum lead encontrado.</p>";

    return;

}

        snapshot.forEach((doc)=>{

    const lead = doc.data();

   const html = `

<div class="lead">

    <strong>${lead.nome || "Sem nome"}</strong><br>

    📞 ${lead.telefone || ""}<br>

    📧 ${lead.email || ""}<br>

    💼 ${lead.servico || ""}<br>

    📝 ${lead.observacao || ""}<br>

📌 Status: ${lead.status || "novo"}<br>

🗒️ Anotações:<br>

<textarea rows="4" cols="35">
${lead.anotacoes || ""}
</textarea>

<br><br>

<button onclick="moverLead('${doc.id}','atendimento')">
📞 Em Atendimento
</button>
<button onclick="moverLead('${doc.id}','cliente')">
✅ Cliente
</button>
<button onclick="moverLead('${doc.id}','perdido')">
❌ Perdido
</button>

<br><br>


`;

if(!lead.status || lead.status === "novo"){

    contadorNovos++;
    novos.innerHTML += html;

} else if(lead.status === "atendimento"){

    contadorAtendimento++;
    atendimento.innerHTML += html;

} else if(lead.status === "cliente"){

    contadorClientes++;
    clientes.innerHTML += html;

} else if(lead.status === "perdido"){

    contadorPerdidos++;
    perdidos.innerHTML += html;

}

});
totalNovos.textContent = contadorNovos;
totalAtendimento.textContent = contadorAtendimento;
totalClientes.textContent = contadorClientes;
totalPerdidos.textContent = contadorPerdidos;
    }catch(erro){

        console.error(erro);

      novos.innerHTML =
"<p>Erro ao carregar leads.</p>";


    }

}
window.moverLead = async function(id, novoStatus){

    try{

        await updateDoc(
            doc(db,"leads",id),
            {
                status: novoStatus
            }
        );

        carregarLeads();

    }catch(error){
        

        console.error(error);

        alert("Erro ao atualizar status");

    }

}
carregarLeads();
    window.sair = function(){

    sessionStorage.removeItem("crmLiberado");

    window.location.href = "login2.html";

}

</script>

</body>

</html>
